name: Master CI & Distribution

on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Microsoft JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '21'
          cache: 'maven'
      - name: Cache Maven Wrapper
        uses: actions/cache@v6
        with:
          path: .mvn/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('**/maven-wrapper.properties') }}
      - name: Cache Spotless Index
        uses: actions/cache@v6
        with:
          path: ~/.spotless
          key: ${{ runner.os }}-spotless-${{ hashFiles('**/pom.xml') }}
      - name: Run Spotless Check
        run: ./mvnw spotless:check

  build:
    name: Build & Archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Microsoft JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '21'
          cache: 'maven'
      - name: Cache Maven Wrapper
        uses: actions/cache@v6
        with:
          path: .mvn/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('**/maven-wrapper.properties') }}
      - name: Build JAR
        run: ./mvnw -B clean package -DskipTests
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-binary
          path: target/*.jar
          retention-days: 7
      - name: Attest JAR provenance
        uses: actions/attest@v4
        with:
          subject-path: target/*.jar

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Microsoft JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '21'
          cache: 'maven'
      - name: Cache Maven Wrapper
        uses: actions/cache@v6
        with:
          path: .mvn/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('**/maven-wrapper.properties') }}
      - name: Run Maven Verify
        run: ./mvnw -B test

  security:
    name: Security Scan (CodeQL)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Microsoft JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '21'
          cache: 'maven'
      - name: Cache Maven Wrapper
        uses: actions/cache@v6
        with:
          path: .mvn/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('**/maven-wrapper.properties') }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'java'
      - name: Build for Scanning
        run: ./mvnw -B clean compile
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  distribution:
    name: Publish Images
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: app-binary
          path: target/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to Hub & GHCR
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            docker.io/subhrodip/twitter-backend-java:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest Docker Hub image provenance
        uses: actions/attest@v4
        with:
          subject-name: docker.io/subhrodip/twitter-backend-java
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest GHCR image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
